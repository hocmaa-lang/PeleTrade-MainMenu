button{width:100%;padding:12px;font-size:15px;font-weight:650;font-family:var(--sans);cursor:pointer;

button:disabled{opacity:.55;cursor:progress}
.err{color:var(--crit);font-size:13.5px;min-height:20px;margin-top:12px;font-family:var(--mono)}

    // an async callback renders the markup but does not reliably run the page's
    // own <script> — which silently breaks any interactive document. A blob URL
    // gets a clean parse, same origin, and nothing leaves the browser.
    const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
    location.replace(url);
  }catch(_){
    err.textContent='Wrong username or password.';
    btn.disabled=false;
  }
});
</script></body></html>
